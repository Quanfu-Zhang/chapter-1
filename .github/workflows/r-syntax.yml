name: R syntax check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parse-r-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse all R files
        shell: Rscript {0}
        run: |
          files <- list.files("R", pattern = "\\.[Rr]$", recursive = TRUE, full.names = TRUE)
          failures <- character()
          for (f in files) {
            cat("Parsing", f, "... ")
            ok <- tryCatch({ parse(file = f); TRUE }, error = function(e) {
              message(conditionMessage(e)); FALSE
            })
            if (ok) cat("OK\n") else failures <- c(failures, f)
          }
          if (length(failures)) stop("R parse failures: ", paste(failures, collapse = ", "))
